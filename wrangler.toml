name = "onde-passa"
main = "src/index.ts"
compatibility_date = "2026-10-15"

# Custom domain: Cloudflare creates the DNS record and certificate on deploy. workers.dev stays on too.
routes = [{ pattern = "ondepassa.felipemfp.dev", custom_domain = true }]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "onde-passa"
database_id = "bdaa2526-da0a-417d-ac43-2374badd514a"
migrations_dir = "migrations"

[triggers]
crons = ["0 */4 * * *"]

[observability]
enabled = true
